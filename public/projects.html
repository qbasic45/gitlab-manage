<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab 项目权限管理</title>
    <style>
        :root {
            /* 浅蓝色系主色调 */
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --primary-light: #e0f2fe;
            --primary-border: #bae6fd;

            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --secondary: #64748b;
            
            /* 背景与文本 */
            --bg-body: #f0f9ff;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            /* 圆角与阴影 */
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
            --shadow-lg: 0 10px 15px -3px rgb(14 165 233 / 0.05), 0 4px 6px -4px rgb(14 165 233 / 0.05);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
            background-color: var(--bg-body);
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
        }
        
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: var(--bg-surface); 
            padding: 40px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        h1 { 
            text-align: center; 
            color: var(--text-main);
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
        }
        
        /* 导航栏 */
        .nav {
            display: flex;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .nav a { 
            flex: 1;
            text-align: center;
            padding: 12px 24px; 
            text-decoration: none; 
            color: var(--text-muted);
            border-radius: var(--radius-md); 
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        .nav a:hover { color: var(--text-main); background: var(--bg-surface); }
        
        .nav a.active { 
            background: var(--bg-surface);
            color: var(--primary); 
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }
        
        /* 搜索和筛选 */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        
        .filter-bar input, .filter-bar select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: white;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        
        .filter-bar input:focus, .filter-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); /* 浅蓝色光环 */
        }
        
        .filter-bar input { flex: 2; min-width: 200px; }
        .filter-bar select { flex: 1; min-width: 150px; cursor: pointer; }
        
        button { 
            padding: 10px 20px; 
            background: var(--success);
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        
        button:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        button:active { transform: translateY(0); }
        
        button.primary { background: var(--primary); }
        button.primary:hover { background: var(--primary-hover); }
        button.secondary { background: var(--secondary); }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        
        button:disabled { 
            background: var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 统计信息 */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-card h4 { margin: 0 0 8px 0; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .stat-card .number { font-size: 36px; font-weight: 800; color: var(--text-main); }

        .stat-card:nth-child(1) .number { color: var(--primary); }
        .stat-card:nth-child(2) .number { color: var(--success); }
        .stat-card:nth-child(3) .number { color: var(--warning); }
        
        /* 树状结构样式 */
        .tree-container {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: white;
            box-shadow: var(--shadow-sm);
        }
        
        .tree-node { border-bottom: 1px solid var(--border-color); position: relative; }
        .tree-node:last-child { border-bottom: none; }
        
        .group-node { background: #ffffff; padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .group-node:hover { background: var(--bg-body); } /* 悬浮为极浅蓝 */
        
        .group-info { display: flex; align-items: center; gap: 16px; flex: 1; }
        
        .group-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .group-details { flex: 1; }
        .group-name { font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
        .group-path { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
        .group-actions { display: flex; align-items: center; gap: 12px; }
        
        .project-count { background: #f1f5f9; color: var(--text-muted); padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        
        .expand-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 12px;
            background: white;
            border-radius: 50%;
            border: 1px solid var(--border-color);
        }
        .expand-icon.expanded { transform: rotate(90deg); background: var(--primary); color: white; border-color: var(--primary); }
        
        .children-container { display: none; background: #f8fafc; border-top: 1px solid var(--border-color); }
        .children-container.expanded { display: block; animation: slideDown 0.3s ease; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-children { padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }
        
        /* 表格样式 */
        .projects-table-container { padding: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        
        th { background: #f1f5f9; font-weight: 600; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        tr { transition: background 0.2s; background: white; }
        tr:hover { background: var(--bg-body); }
        tr:last-child td { border-bottom: none; }
        
        /* 权限标签美化 */
        .permission-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin: 2px;
            white-space: nowrap;
            cursor: help;
            border: 1px solid transparent;
        }
        .permission-tag.has-expiry { border-style: dashed; border-color: currentColor; }
        
        .perm-owner { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
        .perm-maintainer { background: #fef3c7; color: #b45309; border-color: #fcd34d; }
        .perm-developer { background: #d1fae5; color: #047857; border-color: #6ee7b7; }
        .perm-reporter { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }
        .perm-guest { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
        .perm-unknown { background: #f1f5f9; color: #0f172a; }
        .permission-tag.expired { opacity: 0.5; text-decoration: line-through; }
        .member-info { display: flex; flex-wrap: wrap; gap: 6px; }
        
        /* 项目链接 */
        .project-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; }
        .project-link:hover { text-decoration: underline; color: var(--primary-hover); }
        
        .loading, .empty-state { text-align: center; padding: 60px; color: var(--text-muted); font-size: 15px; }
        #result { margin-top: 24px; padding: 16px 20px; border-radius: var(--radius-sm); display: none; font-size: 14px; }
        .success { background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .error { background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }
        
        /* 弹窗样式 */
        .member-modal, .edit-perm-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .member-modal.show, .edit-perm-modal.show { display: flex; }
        .member-modal-content, .edit-perm-modal-content {
            background: white; border-radius: var(--radius-lg); width: 90%; max-width: 700px; max-height: 85vh;
            overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); display: flex; flex-direction: column;
            animation: modalSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalSlideIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .member-modal-header, .edit-perm-modal-header {
            background: #f8fafc; color: var(--text-main); padding: 20px 24px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
        }
        .member-modal-header h3, .edit-perm-modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; }
        
        .member-modal-close, .edit-perm-modal-close {
            background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer;
            padding: 4px; line-height: 1; transition: color 0.2s; box-shadow: none;
        }
        .member-modal-close:hover, .edit-perm-modal-close:hover { color: var(--danger); transform: none; box-shadow: none; }
        
        .member-modal-body, .edit-perm-modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .edit-perm-modal-footer {
            padding: 20px 24px; border-top: 1px solid var(--border-color); display: flex;
            justify-content: flex-end; gap: 12px; background: #f8fafc;
        }
        
        .member-list { list-style: none; padding: 0; margin: 0; }
        .member-list-item {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
            border-radius: var(--radius-sm); margin-bottom: 8px; background: #f8fafc; border: 1px solid var(--border-color);
        }
        
        .member-info-detail { display: flex; align-items: center; gap: 12px; }
        .member-username { font-weight: 600; color: var(--text-main); }
        .member-expiry { font-size: 13px; color: var(--text-muted); }
        .member-expiry.expired { color: var(--danger); font-weight: 500; }
        
        .view-members-btn, .edit-perm-btn {
            background: white; color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 14px;
            border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .view-members-btn:hover, .edit-perm-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        
        /* 特化：编辑权限按钮为浅蓝色调 */
        .edit-perm-btn { color: var(--primary); border-color: var(--primary-border); background: var(--bg-body); }
        .edit-perm-btn:hover { background: var(--primary-light); border-color: var(--primary); }

        /* 编辑成员表格 */
        .perm-edit-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 16px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-color); }
        .perm-edit-table th, .perm-edit-table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        .perm-edit-table tr:last-child td { border-bottom: none; }
        .perm-edit-table tr.marked-delete { background: #fef2f2; opacity: 0.8; }
        .perm-edit-table tr.marked-delete td { text-decoration: line-through; color: var(--text-muted); }
        .perm-edit-table tr.is-new { background: #ecfdf5; }
        .perm-edit-table tr.is-modified { background: #fffbeb; }
        
        .perm-edit-table select, .perm-edit-table input {
            padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; width: 100%;
        }
        .perm-edit-table select:focus, .perm-edit-table input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }
        
        .add-member-section {
            background: #f8fafc; padding: 24px; border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid var(--border-color);
        }
        .add-member-section h4 { margin: 0 0 16px 0; font-size: 15px; color: var(--text-main); font-weight: 600; }
        .add-member-form { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
        .add-member-form .form-group { display: flex; flex-direction: column; gap: 6px; }
        .add-member-form label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .add-member-form input, .add-member-form select { padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); }
        
        .user-search-container { position: relative; }
        .user-search-results {
            position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); max-height: 220px; overflow-y: auto; z-index: 10;
            box-shadow: var(--shadow-lg); display: none; margin-top: 8px;
        }
        .user-search-results.show { display: block; }
        .user-search-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .user-search-item:hover { background: #f8fafc; }
        
        .changes-summary {
            background: var(--bg-body); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 24px; font-size: 14px;
            border: 1px solid var(--primary-border); color: #0369a1;
        }
        .changes-summary .change-count { font-weight: 700; color: var(--primary); }
        
        .group-members-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .member-count-badge { background: #e2e8f0; color: var(--text-main); padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; margin-left: 8px; }
        .description { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        
        .subgroups-wrapper { border-left: 2px solid var(--border-color); margin-left: 42px; padding-left: 10px; }
        .error-message { padding: 20px; color: var(--danger); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>GitLab 项目权限管理</h1>
    <p class="subtitle">管理组和项目的成员权限，支持批量编辑和有效期设置</p>
    
    <div class="nav">
        <a href="index.html">👥 用户管理</a>
        <a href="projects.html" class="active">🛡️ 项目权限</a>
        <a href="expiring.html">⏰ 即将过期</a>
        <a href="permanent.html">♾️ 长期权限</a>
    </div>
    
    <div class="stats" id="statsSection" style="display: none;">
        <div class="stat-card">
            <h4>总组数</h4>
            <div class="number" id="totalGroups">0</div>
        </div>
        <div class="stat-card">
            <h4>已加载项目数</h4>
            <div class="number" id="totalProjects">0</div>
        </div>
        <div class="stat-card">
            <h4>已加载成员数</h4>
            <div class="number" id="totalMembers">0</div>
        </div>
    </div>
    
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索组名称..." onkeypress="if(event.key==='Enter') doSearch()">
        <input type="text" id="urlInput" placeholder="输入 GitLab URL (如: https://.../group/project)" style="flex: 2; min-width: 250px;">
        <button onclick="navigateByUrl()" class="primary">定位项目</button>
        <select id="permissionFilter" onchange="onPermissionFilterChange()">
            <option value="">所有权限</option>
            <option value="50">所有者 (Owner)</option>
            <option value="40">维护者 (Maintainer)</option>
            <option value="30">开发者 (Developer)</option>
            <option value="20">报告者 (Reporter)</option>
            <option value="10">访客 (Guest)</option>
        </select>
        <select id="expiryFilter" onchange="onPermissionFilterChange()">
            <option value="">所有有效期</option>
            <option value="has_expiry">有有效期</option>
            <option value="no_expiry">永久有效</option>
            <option value="expired">已过期</option>
        </select>
        <button onclick="loadGroups()" class="primary">刷新列表</button>
        <button onclick="expandAll()" class="secondary">全部展开</button>
        <button onclick="collapseAll()" class="secondary">全部折叠</button>
    </div>
    
    <div id="loadingState" class="loading">
        <p>正在加载组列表...</p>
    </div>
    
    <div id="treeContainer" class="tree-container" style="display: none;"></div>
    
    <div id="result"></div>
</div>

<div id="memberModal" class="member-modal" onclick="closeMemberModal(event)">
    <div class="member-modal-content" onclick="event.stopPropagation()">
        <div class="member-modal-header">
            <h3 id="memberModalTitle">项目成员详情</h3>
            <button class="member-modal-close" onclick="closeMemberModal()">&times;</button>
        </div>
        <div class="member-modal-body">
            <ul id="memberList" class="member-list"></ul>
        </div>
    </div>
</div>

<div id="editPermModal" class="edit-perm-modal" onclick="closeEditPermModal(event)">
    <div class="edit-perm-modal-content" onclick="event.stopPropagation()">
        <div class="edit-perm-modal-header">
            <h3 id="editPermModalTitle">编辑权限</h3>
            <button class="edit-perm-modal-close" onclick="closeEditPermModal()">&times;</button>
        </div>
        <div class="edit-perm-modal-body">
            <div id="changesSummary" class="changes-summary" style="display: none;">
                待保存变更: <span class="change-count" id="changeCount">0</span> 项
            </div>
            
            <div class="add-member-section">
                <h4>➕ 添加成员</h4>
                <div class="add-member-form">
                    <div class="form-group user-search-container">
                        <label>用户名</label>
                        <input type="text" id="newMemberUsername" class="user-search-input" placeholder="输入搜索..." autocomplete="off">
                        <div id="userSearchResults" class="user-search-results"></div>
                    </div>
                    <div class="form-group">
                        <label>权限级别</label>
                        <select id="newMemberPerm" class="perm-select">
                            <option value="50">Owner (所有者)</option>
                            <option value="40">Maintainer (维护者)</option>
                            <option value="30" selected>Developer (开发者)</option>
                            <option value="20">Reporter (报告者)</option>
                            <option value="10">Guest (访客)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>有效期 (可选)</label>
                        <input type="date" id="newMemberExpiry" class="expiry-input">
                    </div>
                    <button onclick="addNewMember()" class="primary" style="margin-bottom: 2px; margin-left: auto;">添加</button>
                </div>
            </div>
            
            <h4 style="margin: 0 0 12px 0; font-size: 15px; font-weight:600;">现有成员</h4>
            <div style="overflow-x: auto;">
                <table class="perm-edit-table">
                    <thead>
                        <tr>
                            <th style="width: 150px;">用户名</th>
                            <th style="width: 180px;">权限级别</th>
                            <th style="width: 150px;">有效期</th>
                            <th style="width: 100px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="permEditTableBody">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="edit-perm-modal-footer">
            <button onclick="closeEditPermModal()" class="secondary">取消</button>
            <button onclick="savePermissionChanges()" class="primary" id="savePermBtn">保存更改</button>
        </div>
    </div>
</div>

<div id="editRemarkModal" class="edit-perm-modal" onclick="closeEditRemarkModal(event)">
    <div class="edit-perm-modal-content" onclick="event.stopPropagation()" style="max-width: 500px;">
        <div class="edit-perm-modal-header">
            <h3 id="editRemarkModalTitle">编辑备注</h3>
            <button class="edit-perm-modal-close" onclick="closeEditRemarkModal()">&times;</button>
        </div>
        <div class="edit-perm-modal-body">
            <div class="form-group">
                <label>备注 (Description)</label>
                <textarea id="remarkTextarea" style="width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; resize: vertical;"></textarea>
            </div>
        </div>
        <div class="edit-perm-modal-footer">
            <button onclick="closeEditRemarkModal()" class="secondary">取消</button>
            <button onclick="saveRemark()" class="primary" id="saveRemarkBtn">保存</button>
        </div>
    </div>
</div>

<script>
    // JS 逻辑部分完全保持不变，以确保功能稳定
    let allGroups = [];
    let filteredGroups = [];
    let projectsCache = {};
    let stats = { totalProjects: 0, totalMembers: 0 };
    
    let currentEditTarget = null;
    let currentRemarkTarget = null; // 新增：当前正在编辑备注的目标
    let originalMembers = [];
    let pendingChanges = [];
    let selectedUserForAdd = null;
    
    document.addEventListener('DOMContentLoaded', () => {
        loadGroups();
        
        const userSearchInput = document.getElementById('newMemberUsername');
        let searchTimeout = null;
        userSearchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const searchTerm = e.target.value.trim();
            if (searchTerm.length >= 2) {
                searchTimeout = setTimeout(() => searchUsers(searchTerm), 300);
            } else {
                hideUserSearchResults();
            }
        });

        // 监听 URL 输入框的回车事件
        const urlInput = document.getElementById('urlInput');
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigateByUrl();
        });

        // 监听 hash 变化实现分享定位
        window.addEventListener('hashchange', () => {
            const hashPath = window.location.hash.substring(1);
            if (hashPath) navigateByPath(hashPath);
        });
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-search-container')) {
                hideUserSearchResults();
            }
        });
    });
    
    function showResult(type, message) {
        const resultDiv = document.getElementById('result');
        resultDiv.className = type; 
        resultDiv.innerHTML = message;
        resultDiv.style.display = 'block';
        if (type === 'success') { setTimeout(() => { resultDiv.style.display = 'none'; }, 5000); }
    }
    
    async function apiCall(endpoint, data, method = 'GET') {
        try {
            const options = { method: method, headers: { 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(endpoint, options);
            const result = await response.json();
            if (response.ok) { return { success: true, ...result }; } 
            else { return { success: false, error: result.error || '未知错误' }; }
        } catch (e) { return { success: false, error: e.message }; }
    }
    
    async function loadGroups() {
        const container = document.getElementById('treeContainer');
        const loadingState = document.getElementById('loadingState');
        const statsSection = document.getElementById('statsSection');
        allGroups = []; filteredGroups = []; projectsCache = {}; stats = { totalProjects: 0, totalMembers: 0 };
        
        loadingState.style.display = 'block'; container.style.display = 'none'; container.innerHTML = ''; statsSection.style.display = 'none';
        const res = await apiCall('/api/groups', null, 'GET');
        loadingState.style.display = 'none';
        
        if (res.success) {
            allGroups = res.groups || []; filteredGroups = [...allGroups];
            document.getElementById('totalGroups').textContent = allGroups.length;
            statsSection.style.display = 'grid';
            renderTree();
            showResult('success', `成功加载 ${allGroups.length} 个组，点击组名称查看项目`);
            
            // 自动定位处理
            setTimeout(handleAutoNavigation, 100);
        } else {
            showResult('error', '加载组列表失败: ' + res.error);
            container.innerHTML = `<div class="error-message">加载失败: ${res.error}</div>`;
            container.style.display = 'block';
        }
    }
    
    function renderTree() {
        const container = document.getElementById('treeContainer');
        container.innerHTML = '';
        if (filteredGroups.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无数据</div>'; container.style.display = 'block'; return;
        }
        filteredGroups.forEach(group => { container.appendChild(createGroupNodeRecursive(group, 0)); });
        container.style.display = 'block';
    }
    
    function createGroupNodeRecursive(group, level) {
        const node = document.createElement('div'); node.className = 'tree-node'; node.dataset.groupId = group.id;
        const hasLoaded = projectsCache[group.id] !== undefined;
        const projectCount = hasLoaded ? projectsCache[group.id].length : '?';
        const hasChildren = group.has_subgroups || (group.children && group.children.length > 0);
        const childrenLoaded = group.children && group.children.length > 0;
        const indentStyle = level > 0 ? `padding-left: ${level * 30 + 15}px;` : '';
        const icon = hasChildren ? '📁' : '📂';
        const membersPreview = formatGroupMembersPreview(group.members);
        const memberCount = group.members ? group.members.length : 0;
        
        node.innerHTML = `
            <div class="group-node" style="${indentStyle}" onclick="onGroupClick(${group.id}, this)">
                <div class="group-info">
                    <div class="group-icon">${icon}</div>
                    <div class="group-details">
                        <div class="group-name">${escapeHtml(group.name)} ${memberCount > 0 ? `<span class="member-count-badge">${memberCount} 成员</span>` : ''}</div>
                        <div class="group-path">
                            ID: ${group.id} | ${escapeHtml(group.full_path)} 
                            <span class="remark-container" style="display:inline-flex; align-items:center; gap:4px; margin-left:4px;">
                                <span id="group-desc-${group.id}">${group.description ? '| ' + escapeHtml(group.description) : ''}</span>
                                <span class="edit-remark-icon" title="编辑备注" style="cursor:pointer; color:var(--primary); font-size:12px;" onclick="event.stopPropagation(); openEditRemarkModal('group', ${group.id}, '${escapeHtml(group.name)}', '${escapeHtml(group.description || '')}')">✏️</span>
                            </span>
                        </div>
                        ${membersPreview ? `<div class="group-members-preview">${membersPreview}</div>` : ''}
                    </div>
                </div>
                <div class="group-actions">
                    <span class="project-count" id="count-${group.id}">${projectCount} 个项目</span>
                    <button class="edit-perm-btn" onclick="event.stopPropagation(); openEditPermModal('group', ${group.id}, '${escapeHtml(group.name)}')">编辑权限</button>
                    ${hasChildren ? `<span class="expand-icon" id="icon-${group.id}">▶</span>` : ''}
                </div>
            </div>
            ${hasChildren ? `<div class="subgroups-wrapper" style="display: none;" id="subgroups-${group.id}"></div>` : ''}
            <div class="children-container" id="children-${group.id}"><div class="loading-children">点击加载项目...</div></div>
        `;
        
        if (childrenLoaded && hasChildren) {
            const subgroupsContainer = node.querySelector(`#subgroups-${group.id}`);
            group.children.forEach(child => { subgroupsContainer.appendChild(createGroupNodeRecursive(child, level + 1)); });
        }
        return node;
    }
    
    function formatGroupMembersPreview(members) {
        if (!members || members.length === 0) return '';
        const permissionFilter = document.getElementById('permissionFilter').value;
        const expiryFilter = document.getElementById('expiryFilter').value;
        let filteredMembers = members;
        if (permissionFilter) filteredMembers = filteredMembers.filter(m => m.access_level === parseInt(permissionFilter));
        if (expiryFilter) filteredMembers = filteredMembers.filter(m => checkExpiryFilter(m, expiryFilter));
        if (filteredMembers.length === 0) return '<span style="color: #999; font-size: 11px;">无匹配成员</span>';
        
        const displayMembers = [...filteredMembers].sort((a, b) => b.access_level - a.access_level).slice(0, 5);
        const tags = displayMembers.map(member => {
            const permClass = getPermissionClass(member.access_level);
            const hasExpiry = member.expires_at;
            const isExpired = hasExpiry && new Date(member.expires_at) < new Date();
            const expiryClass = hasExpiry ? (isExpired ? 'expired' : 'has-expiry') : '';
            const permText = getPermissionText(member.access_level);
            let expiryDisplay = '', expiryTitle = '永久有效';
            if (hasExpiry) {
                const dateStr = formatDate(member.expires_at);
                if (isExpired) { expiryDisplay = '[过期:' + dateStr + ']'; expiryTitle = '已于 ' + dateStr + ' 过期'; } 
                else { expiryDisplay = '[' + dateStr + ']'; expiryTitle = '有效期至: ' + dateStr; }
            }
            return `<span class="permission-tag ${permClass} ${expiryClass}" title="${permText} | ${expiryTitle}">${escapeHtml(member.username)}${expiryDisplay}</span>`;
        });
        if (filteredMembers.length > 5) tags.push(`<span style="color: #999; font-size: 11px; margin-left: 4px;">+${filteredMembers.length - 5} 更多...</span>`);
        return tags.join('');
    }
    
    async function onGroupClick(groupId, element) {
        const childrenContainer = document.getElementById(`children-${groupId}`);
        const subgroupsContainer = document.getElementById(`subgroups-${groupId}`);
        const icon = document.getElementById(`icon-${groupId}`);
        const isExpanded = childrenContainer.classList.contains('expanded') || (subgroupsContainer && subgroupsContainer.style.display === 'block');
        
        if (isExpanded) {
            childrenContainer.classList.remove('expanded');
            if (subgroupsContainer) subgroupsContainer.style.display = 'none';
            if (icon) icon.classList.remove('expanded');
            return;
        }
        
        if (icon) icon.classList.add('expanded');
        const groupNode = element.closest('.tree-node');
        const needsLoadChildren = subgroupsContainer && subgroupsContainer.children.length === 0;
        const needsLoadMembers = !groupNode.dataset.membersLoaded;
        
        if (needsLoadChildren || needsLoadMembers) {
            childrenContainer.innerHTML = '<div class="loading-children">正在加载子组和成员信息...</div>';
            childrenContainer.classList.add('expanded');
            
            const res = await apiCall(`/api/groups/${groupId}/children`, null, 'GET');
            if (res.success) {
                const groupData = findGroupInTree(groupId);
                if (groupData) { 
                    groupData.members = res.members || []; 
                    groupData.members_loaded = true;
                    // 重要：更新数据树中的子组信息，供导航使用
                    if (res.subgroups) groupData.children = res.subgroups || [];
                }
                groupNode.dataset.membersLoaded = 'true';
                
                const membersPreview = formatGroupMembersPreview(res.members);
                const memberCount = res.members ? res.members.length : 0;
                const groupDetails = element.querySelector('.group-details');
                const groupNameEl = groupDetails.querySelector('.group-name');
                const existingBadge = groupNameEl.querySelector('.member-count-badge');
                if (existingBadge) { existingBadge.textContent = `${memberCount} 成员`; } 
                else if (memberCount > 0) { groupNameEl.innerHTML += ` <span class="member-count-badge">${memberCount} 成员</span>`; }
                
                let previewEl = groupDetails.querySelector('.group-members-preview');
                if (membersPreview) {
                    if (previewEl) previewEl.innerHTML = membersPreview;
                    else groupDetails.insertAdjacentHTML('beforeend', `<div class="group-members-preview">${membersPreview}</div>`);
                } else if (previewEl) previewEl.remove();
                
                if (res.subgroups && res.subgroups.length > 0 && subgroupsContainer) {
                    res.subgroups.forEach(childGroup => { subgroupsContainer.appendChild(createGroupNodeRecursive(childGroup, getGroupLevel(groupNode) + 1)); });
                }
                if (subgroupsContainer && subgroupsContainer.children.length > 0) subgroupsContainer.style.display = 'block';
                await loadGroupProjects(groupId, childrenContainer);
            } else { childrenContainer.innerHTML = `<div class="error-message">加载失败: ${res.error}</div>`; }
        } else {
            if (subgroupsContainer) subgroupsContainer.style.display = 'block';
            childrenContainer.classList.add('expanded');
            if (projectsCache[groupId]) renderProjects(groupId, projectsCache[groupId]);
            else await loadGroupProjects(groupId, childrenContainer);
        }
    }
    
    async function loadGroupProjects(groupId, container) {
        container.innerHTML = '<div class="loading-children">正在加载项目...</div>';
        const res = await apiCall(`/api/groups/${groupId}/projects`, null, 'GET');
        if (res.success) {
            const projects = res.projects || []; projectsCache[groupId] = projects;
            stats.totalProjects += projects.length; projects.forEach(p => { stats.totalMembers += p.members ? p.members.length : 0; });
            updateStats();
            const countEl = document.getElementById(`count-${groupId}`);
            if (countEl) countEl.textContent = `${projects.length} 个项目`;
            renderProjects(groupId, projects);
        } else { container.innerHTML = `<div class="error-message">加载项目失败: ${res.error}</div>`; }
    }
    
    function findGroupInTree(groupId) {
        function search(groups) {
            for (const group of groups) {
                if (group.id === groupId) return group;
                if (group.children && group.children.length > 0) { const found = search(group.children); if (found) return found; }
            }
            return null;
        }
        return search(allGroups);
    }
    
    function getGroupLevel(groupNode) {
        let level = 0; let parent = groupNode.parentElement;
        while (parent) { if (parent.classList && parent.classList.contains('subgroups-wrapper')) level++; parent = parent.parentElement; }
        return level;
    }
    
    function renderProjects(groupId, projects) {
        const container = document.getElementById(`children-${groupId}`);
        const permissionFilter = document.getElementById('permissionFilter').value;
        if (projects.length === 0) { container.innerHTML = '<div class="empty-state">该组下暂无项目</div>'; return; }
        
        let displayProjects = projects;
        const expiryFilter = document.getElementById('expiryFilter').value;
        if (permissionFilter || expiryFilter) {
            displayProjects = projects.filter(project => {
                if (!project.members) return false;
                return project.members.some(m => {
                    const levelMatch = !permissionFilter || m.access_level === parseInt(permissionFilter);
                    const expiryMatch = !expiryFilter || checkExpiryFilter(m, expiryFilter);
                    return levelMatch && expiryMatch;
                });
            });
        }
        if (displayProjects.length === 0) { container.innerHTML = '<div class="empty-state">没有符合筛选条件的项目</div>'; return; }
        
        let tableHtml = `<div class="projects-table-container"><table><thead><tr><th style="width: 80px;">ID</th><th>项目名称</th><th style="width: 250px;">项目路径</th><th style="width: 350px;">成员权限</th></tr></thead><tbody>`;
        displayProjects.forEach(project => {
            const membersHtml = formatMembers(project.members, permissionFilter, expiryFilter);
            tableHtml += `
                <tr>
                    <td>${project.id}</td>
                    <td>
                        <a href="${project.web_url}" target="_blank" class="project-link">${escapeHtml(project.name)}</a>
                        <div class="description" style="display:flex; align-items:center; gap:6px;">
                            <span id="project-desc-${project.id}">${project.description ? escapeHtml(project.description) : ''}</span>
                            <span class="edit-remark-icon" title="编辑备注" style="cursor:pointer; color:var(--primary); font-size:12px;" onclick="openEditRemarkModal('project', ${project.id}, '${escapeHtml(project.name)}', '${escapeHtml(project.description || '')}')">✏️</span>
                        </div>
                    </td>
                    <td><span style="color:#64748b">${escapeHtml(project.path_with_namespace || '')}</span></td>
                    <td>
                        <div class="member-info">${membersHtml}</div>
                        <div style="margin-top: 12px; display:flex; gap:8px;">
                            ${project.members && project.members.length > 0 ? `<button class="view-members-btn" onclick="showMemberModalForProject(${project.id})">详情 (${project.members.length})</button>` : ''}
                            <button class="edit-perm-btn" onclick="openEditPermModal('project', ${project.id}, '${escapeHtml(project.name)}')">编辑权限</button>
                        </div>
                    </td>
                </tr>`;
        });
        tableHtml += '</tbody></table></div>';
        container.innerHTML = tableHtml;
    }
    
    function formatMembers(members, permissionFilter, expiryFilter) {
        if (!members || members.length === 0) return '<span style="color: #999; font-size: 12px;">无成员</span>';
        return members.map(member => {
            if (permissionFilter && member.access_level !== parseInt(permissionFilter)) return '';
            if (expiryFilter && !checkExpiryFilter(member, expiryFilter)) return '';
            const permClass = getPermissionClass(member.access_level);
            const permText = getPermissionText(member.access_level);
            const hasExpiry = member.expires_at;
            const isExpired = hasExpiry && new Date(member.expires_at) < new Date();
            const expiryClass = hasExpiry ? (isExpired ? 'expired' : 'has-expiry') : '';
            let expiryDisplay = '', expiryTitle = '永久有效';
            if (hasExpiry) {
                const dateStr = formatDate(member.expires_at);
                if (isExpired) { expiryDisplay = '[过期:' + dateStr + ']'; expiryTitle = '已于 ' + dateStr + ' 过期'; }
                else { expiryDisplay = '[' + dateStr + ']'; expiryTitle = '有效期至: ' + dateStr; }
            }
            return `<span class="permission-tag ${permClass} ${expiryClass}" title="${permText} | ${expiryTitle}">${escapeHtml(member.username)}${expiryDisplay}</span>`;
        }).filter(html => html).join('');
    }
    
    function formatDate(dateString) {
        if (!dateString) return ''; const date = new Date(dateString);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    function getPermissionClass(level) {
        switch (level) { case 50: return 'perm-owner'; case 40: return 'perm-maintainer'; case 30: return 'perm-developer'; case 20: return 'perm-reporter'; case 10: return 'perm-guest'; default: return 'perm-unknown'; }
    }
    function getPermissionText(level) {
        switch (level) { case 50: return '所有者'; case 40: return '维护者'; case 30: return '开发者'; case 20: return '报告者'; case 10: return '访客'; default: return '未知'; }
    }
    
    function updateStats() {
        document.getElementById('totalProjects').textContent = stats.totalProjects;
        document.getElementById('totalMembers').textContent = stats.totalMembers;
    }
    
    function searchGroupsRecursive(groups, searchTerm) {
        const result = [];
        groups.forEach(group => {
            const matches = group.name.toLowerCase().includes(searchTerm) || group.full_path.toLowerCase().includes(searchTerm);
            let matchingChildren = [];
            if (group.children && group.children.length > 0) matchingChildren = searchGroupsRecursive(group.children, searchTerm);
            if (matches || matchingChildren.length > 0) { const newGroup = { ...group }; if (matchingChildren.length > 0) newGroup.children = matchingChildren; result.push(newGroup); }
        });
        return result;
    }
    
    function doSearch() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!searchTerm) filteredGroups = [...allGroups]; else filteredGroups = searchGroupsRecursive(allGroups, searchTerm);
        renderTree();
    }
    
    function updateAllVisibleProjects(groups) {
        groups.forEach(group => {
            const container = document.getElementById(`children-${group.id}`);
            if (container && container.classList.contains('expanded') && projectsCache[group.id]) renderProjects(group.id, projectsCache[group.id]);
            if (group.children && group.children.length > 0) updateAllVisibleProjects(group.children);
        });
    }
    
    function checkExpiryFilter(member, expiryFilter) {
        if (!expiryFilter) return true;
        const now = new Date(), expiryDate = member.expires_at ? new Date(member.expires_at) : null;
        switch (expiryFilter) { case 'has_expiry': return !!member.expires_at; case 'no_expiry': return !member.expires_at; case 'expired': return expiryDate && expiryDate < now; default: return true; }
    }
    
    function onPermissionFilterChange() { updateAllVisibleProjects(filteredGroups); }
    
    async function expandGroupRecursive(group) {
        const childrenContainer = document.getElementById(`children-${group.id}`);
        const subgroupsContainer = document.getElementById(`subgroups-${group.id}`);
        const icon = document.getElementById(`icon-${group.id}`);
        if (childrenContainer && !childrenContainer.classList.contains('expanded')) {
            childrenContainer.classList.add('expanded'); icon.classList.add('expanded');
            if (subgroupsContainer) subgroupsContainer.style.display = 'block';
            if (!projectsCache[group.id]) {
                childrenContainer.innerHTML = '<div class="loading-children">正在加载...</div>';
                const res = await apiCall(`/api/groups/${group.id}/projects`, null, 'GET');
                if (res.success) {
                    const projects = res.projects || []; projectsCache[group.id] = projects;
                    stats.totalProjects += projects.length; projects.forEach(p => { stats.totalMembers += p.members ? p.members.length : 0; });
                    updateStats();
                    document.getElementById(`count-${group.id}`).textContent = `${projects.length} 个项目`;
                    renderProjects(group.id, projects);
                } else { childrenContainer.innerHTML = `<div class="error-message">加载失败</div>`; }
            } else { renderProjects(group.id, projectsCache[group.id]); }
        }
        if (group.children && group.children.length > 0) { for (const child of group.children) await expandGroupRecursive(child); }
    }
    
    async function expandAll() { for (const group of filteredGroups) await expandGroupRecursive(group); }
    
    function collapseGroupRecursive(group) {
        const childrenContainer = document.getElementById(`children-${group.id}`);
        const subgroupsContainer = document.getElementById(`subgroups-${group.id}`);
        const icon = document.getElementById(`icon-${group.id}`);
        if (childrenContainer) childrenContainer.classList.remove('expanded');
        if (subgroupsContainer) subgroupsContainer.style.display = 'none';
        if (icon) icon.classList.remove('expanded');
        if (group.children && group.children.length > 0) group.children.forEach(child => collapseGroupRecursive(child));
    }
    function collapseAll() { filteredGroups.forEach(group => collapseGroupRecursive(group)); }
    
    function showMemberModal(projectName, members) {
        const modal = document.getElementById('memberModal');
        document.getElementById('memberModalTitle').textContent = `${projectName} - 成员详情 (${members.length}人)`;
        const list = document.getElementById('memberList');
        if (!members || members.length === 0) list.innerHTML = '<li class="member-list-item">暂无成员</li>';
        else {
            const sortedMembers = [...members].sort((a, b) => b.access_level - a.access_level);
            list.innerHTML = sortedMembers.map(member => {
                const permClass = getPermissionClass(member.access_level);
                const permText = getPermissionText(member.access_level);
                const hasExpiry = member.expires_at;
                const isExpired = hasExpiry && new Date(member.expires_at) < new Date();
                const expiryClass = isExpired ? 'expired' : '';
                let expiryText = '永久有效', expiryDisplay = '';
                if (hasExpiry) {
                    const dateStr = formatDate(member.expires_at);
                    if (isExpired) { expiryText = '已于 ' + dateStr + ' 过期'; expiryDisplay = '[过期:' + dateStr + ']'; } 
                    else { expiryText = '有效期至: ' + dateStr; expiryDisplay = '[' + dateStr + ']'; }
                }
                return `<li class="member-list-item">
                            <div class="member-info-detail">
                                <span class="permission-tag ${permClass}">${permText}</span>
                                <span class="member-username">${escapeHtml(member.username)}<span class="${expiryClass}">${expiryDisplay}</span></span>
                            </div>
                            <span class="member-expiry ${expiryClass}">${expiryText}</span>
                        </li>`;
            }).join('');
        }
        modal.classList.add('show');
    }
    
    function showMemberModalForProject(projectId) {
        let projectName = '', members = [];
        for (const groupId in projectsCache) {
            const project = projectsCache[groupId].find(p => p.id === projectId);
            if (project) { projectName = project.name; members = project.members || []; break; }
        }
        if (projectName) showMemberModal(projectName, members);
    }
    
    function closeMemberModal(event) {
        if (!event || event.target.id === 'memberModal' || event.target.classList.contains('member-modal-close')) {
            document.getElementById('memberModal').classList.remove('show');
        }
    }
    
    async function openEditPermModal(type, id, name) {
        currentEditTarget = { type, id, name }; originalMembers = []; pendingChanges = []; selectedUserForAdd = null;
        document.getElementById('editPermModalTitle').textContent = `编辑${type === 'group' ? '组' : '项目'}权限 - ${name}`;
        document.getElementById('newMemberUsername').value = '';
        document.getElementById('newMemberPerm').value = '30';
        
        // 设置默认有效期为 90 天后
        const defaultExpiry = new Date();
        defaultExpiry.setDate(defaultExpiry.getDate() + 90);
        document.getElementById('newMemberExpiry').value = formatDate(defaultExpiry);
        
        hideUserSearchResults();
        
        const endpoint = type === 'group' ? `/api/groups/${id}/members/detail` : `/api/projects/${id}/members/detail`;
        const res = await apiCall(endpoint, null, 'GET');
        if (res.success) {
            originalMembers = res.members || [];
            renderPermEditTable(); updateChangesSummary();
            document.getElementById('editPermModal').classList.add('show');
        } else { showResult('error', '加载成员信息失败: ' + res.error); }
    }
    
    function closeEditPermModal(event) {
        if (!event || event.target.id === 'editPermModal' || event.target.classList.contains('edit-perm-modal-close')) {
            document.getElementById('editPermModal').classList.remove('show');
            currentEditTarget = null; originalMembers = []; pendingChanges = []; selectedUserForAdd = null;
        }
    }
    
    function renderPermEditTable() {
        const tbody = document.getElementById('permEditTableBody');
        if (originalMembers.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999; padding:30px;">暂无成员</td></tr>'; return; }
        
        const allMembers = [...originalMembers];
        pendingChanges.filter(c => c.action === 'add').forEach(change => {
            allMembers.push({ user_id: change.user_id, username: change.username, name: change.username, access_level: change.access_level, expires_at: change.expires_at, isNew: true });
        });
        allMembers.sort((a, b) => b.access_level - a.access_level);
        
        tbody.innerHTML = allMembers.map(member => {
            const pendingChange = pendingChanges.find(c => (c.user_id === member.user_id || c.username === member.username) && c.action !== 'add');
            const isNew = member.isNew || pendingChanges.some(c => c.username === member.username && c.action === 'add');
            const isDeleted = pendingChange && pendingChange.action === 'remove';
            const isModified = pendingChange && pendingChange.action === 'update';
            const displayLevel = isModified ? pendingChange.access_level : member.access_level;
            const displayExpiry = isModified ? pendingChange.expires_at : member.expires_at;
            const rowClass = isDeleted ? 'marked-delete' : (isNew ? 'is-new' : (isModified ? 'is-modified' : ''));
            const statusText = isDeleted ? ' (待删除)' : (isNew ? ' (新增)' : (isModified ? ' (已修改)' : ''));
            
            return `<tr class="${rowClass}" data-user-id="${member.user_id}">
                        <td><span class="member-username">${escapeHtml(member.username)}<span style="font-size:12px; color:var(--text-muted);">${statusText}</span></span></td>
                        <td>
                            <select onchange="onMemberLevelChange('${member.user_id}', '${member.username}', this.value)" ${isDeleted ? 'disabled' : ''}>
                                <option value="50" ${displayLevel === 50 ? 'selected' : ''}>Owner (所有者)</option>
                                <option value="40" ${displayLevel === 40 ? 'selected' : ''}>Maintainer (维护者)</option>
                                <option value="30" ${displayLevel === 30 ? 'selected' : ''}>Developer (开发者)</option>
                                <option value="20" ${displayLevel === 20 ? 'selected' : ''}>Reporter (报告者)</option>
                                <option value="10" ${displayLevel === 10 ? 'selected' : ''}>Guest (访客)</option>
                            </select>
                        </td>
                        <td><input type="date" value="${displayExpiry ? formatDate(displayExpiry) : ''}" onchange="onMemberExpiryChange('${member.user_id}', '${member.username}', this.value)" ${isDeleted ? 'disabled' : ''}></td>
                        <td>${isDeleted ? `<button class="secondary sm" style="padding:4px 8px; font-size:12px;" onclick="restoreMember('${member.user_id}', '${member.username}')">恢复</button>` : `<button class="danger sm" style="padding:4px 8px; font-size:12px;" onclick="markMemberForDelete('${member.user_id}', '${member.username}')">删除</button>`}</td>
                    </tr>`;
        }).join('');
    }
    
    async function searchUsers(searchTerm) {
        const res = await apiCall(`/api/users/search?search=${encodeURIComponent(searchTerm)}`, null, 'GET');
        if (res.success) showUserSearchResults(res.users || []);
    }
    
    function showUserSearchResults(users) {
        const container = document.getElementById('userSearchResults');
        if (users.length === 0) container.innerHTML = '<div class="user-search-item"><span style="color:#64748b; font-style:italic;">未找到匹配用户</span></div>';
        else container.innerHTML = users.map(user => `<div class="user-search-item" onclick="selectUserForAdd(${user.id}, '${escapeHtml(user.username)}', '${escapeHtml(user.name)}')"><div class="username">${escapeHtml(user.username)}</div><div style="font-size:12px; color:#64748b; margin-top:2px;">${escapeHtml(user.name)} ${user.email ? '(' + escapeHtml(user.email) + ')' : ''}</div></div>`).join('');
        container.classList.add('show');
    }
    
    function hideUserSearchResults() { document.getElementById('userSearchResults').classList.remove('show'); }
    
    function selectUserForAdd(userId, username, name) {
        selectedUserForAdd = { user_id: userId, username, name };
        document.getElementById('newMemberUsername').value = username;
        hideUserSearchResults();
    }
    
    function addNewMember() {
        if (!selectedUserForAdd) { showResult('error', '请先搜索并选择一个用户'); return; }
        const exists = originalMembers.some(m => m.user_id === selectedUserForAdd.user_id) || pendingChanges.some(c => c.action === 'add' && c.user_id === selectedUserForAdd.user_id);
        if (exists) { showResult('error', '该用户已是成员'); return; }
        
        pendingChanges.push({ action: 'add', user_id: selectedUserForAdd.user_id, username: selectedUserForAdd.username, access_level: parseInt(document.getElementById('newMemberPerm').value), expires_at: document.getElementById('newMemberExpiry').value || null });
        
        // 重置表单，有效期恢复 90 天默认值
        document.getElementById('newMemberUsername').value = ''; 
        document.getElementById('newMemberPerm').value = '30'; 
        const defaultExpiry = new Date();
        defaultExpiry.setDate(defaultExpiry.getDate() + 90);
        document.getElementById('newMemberExpiry').value = formatDate(defaultExpiry);
        
        selectedUserForAdd = null; renderPermEditTable(); updateChangesSummary();
    }
    
    function markMemberForDelete(userId, username) {
        pendingChanges = pendingChanges.filter(c => c.username !== username);
        pendingChanges.push({ action: 'remove', user_id: parseInt(userId), username: username });
        renderPermEditTable(); updateChangesSummary();
    }
    
    function restoreMember(userId, username) { pendingChanges = pendingChanges.filter(c => c.username !== username); renderPermEditTable(); updateChangesSummary(); }
    
    function onMemberLevelChange(userId, username, newLevel) {
        const level = parseInt(newLevel);
        const existingUpdate = pendingChanges.find(c => c.username === username && c.action === 'update');
        if (existingUpdate) {
            existingUpdate.access_level = level;
        } else {
            const existingAdd = pendingChanges.find(c => c.username === username && c.action === 'add');
            if (existingAdd) {
                existingAdd.access_level = level;
            } else {
                const original = originalMembers.find(m => m.user_id === parseInt(userId));
                if (original && original.access_level !== level) pendingChanges.push({ action: 'update', user_id: parseInt(userId), username: username, access_level: level, expires_at: original.expires_at });
            }
        }
        renderPermEditTable(); updateChangesSummary();
    }

    function onMemberExpiryChange(userId, username, newExpiry) {
        const expiry = newExpiry || null;
        const existingUpdate = pendingChanges.find(c => c.username === username && c.action === 'update');
        if (existingUpdate) {
            existingUpdate.expires_at = expiry;
        } else {
            const existingAdd = pendingChanges.find(c => c.username === username && c.action === 'add');
            if (existingAdd) {
                existingAdd.expires_at = expiry;
            } else {
                const original = originalMembers.find(m => m.user_id === parseInt(userId));
                if (original && (original.expires_at ? formatDate(original.expires_at) : null) !== expiry) pendingChanges.push({ action: 'update', user_id: parseInt(userId), username: username, access_level: original.access_level, expires_at: expiry });
            }
        }
        renderPermEditTable(); updateChangesSummary();
    }
    
    function updateChangesSummary() {
        const summary = document.getElementById('changesSummary');
        if (pendingChanges.length === 0) summary.style.display = 'none';
        else { summary.style.display = 'block'; document.getElementById('changeCount').textContent = pendingChanges.length; }
    }
    
    async function savePermissionChanges() {
        if (pendingChanges.length === 0) { closeEditPermModal(); return; }
        const btn = document.getElementById('savePermBtn'); btn.disabled = true; btn.textContent = '保存中...';
        const endpoint = currentEditTarget.type === 'group' ? `/api/groups/${currentEditTarget.id}/members/update` : `/api/projects/${currentEditTarget.id}/members/update`;
        const res = await apiCall(endpoint, { changes: pendingChanges }, 'POST');
        btn.disabled = false; btn.textContent = '保存更改';
        
        if (res.success) {
            if (res.errors && res.errors.length > 0) showResult('error', `保存完成，但有 ${res.errors.length} 个错误: ${res.errors.map(e => e.username + ': ' + e.error).join(', ')}`);
            else showResult('success', `成功保存 ${res.results.length} 个变更`);
            closeEditPermModal(); await refreshAfterPermissionChange();
        } else { showResult('error', '保存失败: ' + res.error); }
    }
    
    async function refreshAfterPermissionChange() {
        if (!currentEditTarget) return;
        if (currentEditTarget.type === 'group') {
            const groupData = findGroupInTree(currentEditTarget.id);
            if (groupData) {
                const res = await apiCall(`/api/groups/${currentEditTarget.id}/children`, null, 'GET');
                if (res.success) {
                    groupData.members = res.members || [];
                    const groupNode = document.querySelector(`.tree-node[data-group-id="${currentEditTarget.id}"]`);
                    if (groupNode) {
                        const groupDetails = groupNode.querySelector('.group-details'), membersPreview = formatGroupMembersPreview(groupData.members), memberCount = groupData.members ? groupData.members.length : 0;
                        const groupNameEl = groupDetails.querySelector('.group-name'), existingBadge = groupNameEl.querySelector('.member-count-badge');
                        if (existingBadge) existingBadge.textContent = `${memberCount} 成员`; else if (memberCount > 0) groupNameEl.innerHTML += ` <span class="member-count-badge">${memberCount} 成员</span>`;
                        let previewEl = groupDetails.querySelector('.group-members-preview');
                        if (membersPreview) { if (previewEl) previewEl.innerHTML = membersPreview; else groupDetails.insertAdjacentHTML('beforeend', `<div class="group-members-preview">${membersPreview}</div>`); } else if (previewEl) previewEl.remove();
                    }
                }
            }
        } else {
            for (const groupId in projectsCache) {
                if (projectsCache[groupId].findIndex(p => p.id === currentEditTarget.id) !== -1) {
                    const res = await apiCall(`/api/groups/${groupId}/projects`, null, 'GET');
                    if (res.success) {
                        projectsCache[groupId] = res.projects || [];
                        const childrenContainer = document.getElementById(`children-${groupId}`);
                        if (childrenContainer && childrenContainer.classList.contains('expanded')) renderProjects(groupId, projectsCache[groupId]);
                    }
                    break;
                }
            }
        }
    }
    
    // 新增：通过 URL 定位组或项目
    async function navigateByUrl() {
        const btn = document.querySelector('button[onclick="navigateByUrl()"]');
        const originalText = btn.textContent;
        try {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { showResult('error', '请输入 GitLab URL'); return; }
            
            btn.disabled = true;
            btn.textContent = '定位中...';
            
            // 如果数据还没加载完，等待一下
            if (allGroups.length === 0) {
                showResult('warning', '正在加载初始数据，请稍等...');
                let retries = 0;
                while (allGroups.length === 0 && retries < 20) {
                    await new Promise(r => setTimeout(r, 500));
                    retries++;
                }
                if (allGroups.length === 0) { 
                    showResult('error', '数据加载超时，请刷新页面重试'); 
                    btn.disabled = false; btn.textContent = originalText;
                    return; 
                }
            }

            const path = parseGitLabUrl(url);
            if (!path) { 
                showResult('error', '无效的 GitLab URL'); 
                btn.disabled = false; btn.textContent = originalText;
                return; 
            }
            
            // 清除现有的过滤器，确保能查找到
            document.getElementById('searchInput').value = '';
            document.getElementById('permissionFilter').value = '';
            document.getElementById('expiryFilter').value = '';
            doSearch(); // 重置显示的树
            
            showResult('success', `正在尝试定位: ${path}...`);
            
            // 确保 DOM 已渲染完成
            await new Promise(r => setTimeout(r, 100));
            
            // 如果是从搜索参数进来的，可能需要稍微延迟等待树渲染
            await navigateByPath(path);
        } catch (e) {
            console.error('Navigation error:', e);
            showResult('error', '定位过程中出错: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    function parseGitLabUrl(url) {
        try {
            if (!url.includes('://')) {
                // 如果不是完整 URL，尝试当作路径处理
                return url.replace(/^\/+/, '').replace(/\/+$/, '');
            }
            const urlObj = new URL(url);
            let path = urlObj.pathname;
            
            // 移除开头的斜杠
            if (path.startsWith('/')) path = path.substring(1);
            // 移除 .git 后缀
            if (path.endsWith('.git')) path = path.substring(0, path.length - 4);
            // 移除结尾的斜杠
            path = path.replace(/\/+$/, "");
            
            const segments = path.split('/');
            const filteredSegments = [];
            for (let i = 0; i < segments.length; i++) {
                const segment = segments[i];
                if (segment === '-') break; // GitLab 分隔符，其后的通常是功能名而非路径
                
                // 仅在路径的最开始跳过 'groups' 或 'projects' 路由前缀
                if (i === 0 && (segment === 'groups' || segment === 'projects')) continue;
                
                // 跳过特定的视图片段
                if (['tree', 'blob', 'edit', 'raw', 'members'].includes(segment)) continue;
                
                filteredSegments.push(segment);
            }
            
            return filteredSegments.join('/');
        } catch (e) {
            return url.replace(/^\/+/, '').replace(/\/+$/, '');
        }
    }

    async function navigateByPath(path) {
        console.log('Navigating to path:', path);
        const segments = path.split('/').filter(s => s);
        let currentLevelGroups = allGroups;
        let lastMatchedGroupId = null;

        for (let i = 0; i < segments.length; i++) {
            const currentPathPrefix = segments.slice(0, i + 1).join('/');
            console.log(`Searching segment ${i}: ${segments[i]}, prefix: ${currentPathPrefix}`);
            
            // 1. 尝试在当前层级查找组
            let group = currentLevelGroups.find(g => g && g.full_path && g.full_path.toLowerCase() === currentPathPrefix.toLowerCase());
            
            // 如果精确路径没找到，尝试在当前层级找 path 匹配的
            if (!group) {
                group = currentLevelGroups.find(g => g && g.path && g.path.toLowerCase() === segments[i].toLowerCase());
            }

            if (group) {
                console.log('Found group:', group.full_path, 'ID:', group.id);
                lastMatchedGroupId = group.id;
                const groupNode = document.querySelector(`.tree-node[data-group-id="${group.id}"]`);
                if (groupNode) {
                    const groupHeader = groupNode.querySelector('.group-node');
                    
                    // 展开该组 (如果是折叠状态)
                    const childrenContainer = document.getElementById(`children-${group.id}`);
                    const subgroupsContainer = document.getElementById(`subgroups-${group.id}`);
                    const isExpanded = childrenContainer.classList.contains('expanded') || (subgroupsContainer && subgroupsContainer.style.display === 'block');
                    
                    if (!isExpanded) {
                        console.log('Expanding group:', group.id);
                        await onGroupClick(group.id, groupHeader);
                    }
                    
                    // 展开哪层就先定位到哪层
                    highlightAndScrollTo(groupHeader);
                    
                    // 如果是路径的最后一个片段，定位并高亮
                    if (i === segments.length - 1) {
                        window.location.hash = path;
                        return;
                    }
                    
                    // 等待子项加载完成以进行下一级查找
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    const groupData = findGroupInTree(group.id);
                    if (groupData && groupData.children) {
                        currentLevelGroups = groupData.children;
                    } else {
                        currentLevelGroups = [];
                    }
                }
            } else {
                console.log('Group not found at this level, might be a project:', segments[i]);
                break; 
            }
        }

        // 2. 如果路径还没定位到组，或者路径还没走完，在最后一个匹配的组下查找项目
        if (lastMatchedGroupId) {
            console.log('Searching for project in group ID:', lastMatchedGroupId);
            const projects = projectsCache[lastMatchedGroupId] || [];
            const targetProjectPath = path.toLowerCase();
            
            const project = projects.find(p => 
                (p.path_with_namespace && p.path_with_namespace.toLowerCase() === targetProjectPath) || 
                (p.path && p.path.toLowerCase() === segments[segments.length - 1].toLowerCase())
            );
            
            if (project) {
                console.log('Found project:', project.name);
                // 项目在表格中，滚动到对应行
                const projectLinks = document.querySelectorAll(`a[href="${project.web_url}"]`);
                if (projectLinks.length > 0) {
                    const row = projectLinks[0].closest('tr');
                    highlightAndScrollTo(row);
                    window.location.hash = path;
                } else {
                    // 如果链接还没渲染出来，尝试等一下
                    setTimeout(() => {
                        const links = document.querySelectorAll(`a[href="${project.web_url}"]`);
                        if (links.length > 0) {
                            highlightAndScrollTo(links[0].closest('tr'));
                            window.location.hash = path;
                        } else {
                            showResult('warning', `找到项目 "${project.name}"，但未能在列表中定位。`);
                        }
                    }, 500);
                }
                return;
            }
        }

        showResult('error', `未能在列表中找到 "${path}" 对应的组或项目。`);
    }

    function highlightAndScrollTo(element) {
        if (!element) return;
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // 高亮动画
        const originalTransition = element.style.transition;
        const originalShadow = element.style.boxShadow;
        const originalOutline = element.style.outline;
        
        element.style.transition = 'all 0.5s ease';
        element.style.outline = '3px solid var(--primary)';
        element.style.boxShadow = '0 0 15px rgba(14, 165, 233, 0.4)';
        
        setTimeout(() => {
            element.style.outline = originalOutline;
            element.style.boxShadow = originalShadow;
            setTimeout(() => {
                element.style.transition = originalTransition;
            }, 500);
        }, 3000);
    }

    function handleAutoNavigation() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        let hashPath = window.location.hash.substring(1);
        
        // 支持 #group=xxx&project=yyy 格式
        if (hashPath.includes('=') && (hashPath.includes('group=') || hashPath.includes('project='))) {
            try {
                const hashParams = new URLSearchParams(hashPath);
                const g = hashParams.get('group');
                const p = hashParams.get('project');
                if (g && p) hashPath = `${g}/${p}`;
                else if (g) hashPath = g;
                else if (p) hashPath = p;
            } catch (e) {}
        }
        
        if (targetUrl) {
            document.getElementById('urlInput').value = targetUrl;
            navigateByUrl();
        } else if (hashPath) {
            navigateByPath(hashPath);
        }
    }

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function openEditRemarkModal(type, id, name, currentRemark) {
        currentRemarkTarget = { type, id, name, originalRemark: currentRemark };
        document.getElementById('editRemarkModalTitle').textContent = `编辑${type === 'group' ? '组' : '项目'}备注 - ${name}`;
        document.getElementById('remarkTextarea').value = currentRemark;
        document.getElementById('editRemarkModal').classList.add('show');
    }

    function closeEditRemarkModal(event) {
        if (!event || event.target.id === 'editRemarkModal' || event.target.classList.contains('edit-perm-modal-close')) {
            document.getElementById('editRemarkModal').classList.remove('show');
            currentRemarkTarget = null;
        }
    }

    async function saveRemark() {
        if (!currentRemarkTarget) return;
        const newRemark = document.getElementById('remarkTextarea').value.trim();
        const btn = document.getElementById('saveRemarkBtn');
        
        btn.disabled = true;
        btn.textContent = '保存中...';
        
        const endpoint = currentRemarkTarget.type === 'group' 
            ? `/api/groups/${currentRemarkTarget.id}/description` 
            : `/api/projects/${currentRemarkTarget.id}/description`;
            
        const res = await apiCall(endpoint, { description: newRemark }, 'PUT');
        btn.disabled = false;
        btn.textContent = '保存';
        
        if (res.success) {
            showResult('success', '备注更新成功');
            
            // 更新本地数据和 UI
            if (currentRemarkTarget.type === 'group') {
                const groupData = findGroupInTree(currentRemarkTarget.id);
                if (groupData) groupData.description = newRemark;
                
                const descEl = document.getElementById(`group-desc-${currentRemarkTarget.id}`);
                if (descEl) descEl.textContent = newRemark ? `| ${newRemark}` : '';
            } else {
                for (const groupId in projectsCache) {
                    const project = projectsCache[groupId].find(p => p.id === currentRemarkTarget.id);
                    if (project) {
                        project.description = newRemark;
                        const descEl = document.getElementById(`project-desc-${currentRemarkTarget.id}`);
                        if (descEl) descEl.textContent = newRemark;
                        break;
                    }
                }
            }
            
            closeEditRemarkModal();
        } else {
            showResult('error', '保存失败: ' + res.error);
        }
    }
